<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HouseMemory AI</title>

    <meta
      name="description"
      content="HouseMemory AI — your intelligent household assistant."
    />

    <style>
      /* =====================================================
           RESET
           ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: #ffffff;

        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(116, 83, 255, 0.18),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(63, 208, 255, 0.14),
            transparent 28%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(196, 80, 255, 0.12),
            transparent 30%
          ),
          #070711;

        overflow-x: hidden;
      }

      /* =====================================================
           BACKGROUND
           ===================================================== */

      .background {
        position: fixed;

        inset: 0;

        pointer-events: none;

        overflow: hidden;

        z-index: 0;
      }

      .grid {
        position: absolute;

        inset: 0;

        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );

        background-size: 60px 60px;

        mask-image: linear-gradient(to bottom, black, transparent);

        animation: gridMove 20s linear infinite;
      }

      @keyframes gridMove {
        from {
          transform: translateY(0);
        }

        to {
          transform: translateY(60px);
        }
      }

      .orb {
        position: absolute;

        border-radius: 50%;

        filter: blur(80px);

        opacity: 0.3;

        animation: floatOrb 12s ease-in-out infinite;
      }

      .orb-one {
        width: 350px;

        height: 350px;

        background: #6b4cff;

        top: -120px;

        left: -100px;
      }

      .orb-two {
        width: 300px;

        height: 300px;

        background: #32cfff;

        right: -100px;

        top: 20%;

        animation-delay: -4s;
      }

      .orb-three {
        width: 250px;

        height: 250px;

        background: #b54cff;

        bottom: -100px;

        left: 40%;

        animation-delay: -8s;
      }

      @keyframes floatOrb {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(30px, -35px) scale(1.12);
        }
      }

      /* =====================================================
           NAVBAR
           ===================================================== */

      .navbar {
        position: relative;

        z-index: 20;

        height: 82px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 6vw;

        border-bottom: 1px solid rgba(255, 255, 255, 0.07);

        background: rgba(7, 7, 17, 0.55);

        backdrop-filter: blur(25px);
      }

      .logo {
        display: flex;

        align-items: center;

        gap: 12px;

        font-size: 17px;

        font-weight: 700;

        letter-spacing: -0.3px;
      }

      .logo-icon {
        width: 38px;

        height: 38px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 12px;

        background: linear-gradient(135deg, #7656ff, #4ddfff);

        box-shadow: 0 0 30px rgba(95, 120, 255, 0.25);

        font-size: 19px;
      }

      .back-button {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding: 10px 16px;

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 12px;

        color: #aaa7b7;

        background: rgba(255, 255, 255, 0.035);

        text-decoration: none;

        font-size: 12px;

        transition: 0.25s ease;
      }

      .back-button:hover {
        color: white;

        border-color: rgba(255, 255, 255, 0.2);

        background: rgba(255, 255, 255, 0.07);

        transform: translateY(-2px);
      }

      /* =====================================================
           MAIN
           ===================================================== */

      .main {
        position: relative;

        z-index: 5;

        min-height: calc(100vh - 82px);

        display: flex;

        flex-direction: column;

        align-items: center;

        padding: 60px 20px 80px;
      }

      /* =====================================================
           HERO
           ===================================================== */

      .hero {
        text-align: center;

        max-width: 800px;

        margin-bottom: 38px;

        animation: heroIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes heroIn {
        from {
          opacity: 0;

          transform: translateY(30px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      .eyebrow {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding: 7px 12px;

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 100px;

        background: rgba(255, 255, 255, 0.035);

        color: #9e99ae;

        font-size: 10px;

        letter-spacing: 1.7px;

        text-transform: uppercase;

        margin-bottom: 20px;
      }

      .eyebrow-dot {
        width: 6px;

        height: 6px;

        border-radius: 50%;

        background: #60ffb1;

        box-shadow: 0 0 10px #60ffb1;

        animation: statusPulse 2s infinite;
      }

      @keyframes statusPulse {
        50% {
          opacity: 0.35;

          transform: scale(0.7);
        }
      }

      .hero h1 {
        font-size: clamp(42px, 7vw, 78px);

        line-height: 0.98;

        letter-spacing: -4px;

        margin-bottom: 22px;

        background: linear-gradient(
          120deg,
          #ffffff 20%,
          #b9b0ff 55%,
          #6fe7ff 90%
        );

        -webkit-background-clip: text;

        background-clip: text;

        color: transparent;
      }

      .hero h1 span {
        display: inline-block;

        animation: shine 4s ease-in-out infinite;
      }

      @keyframes shine {
        0%,
        100% {
          filter: brightness(1);
        }

        50% {
          filter: brightness(1.35);
        }
      }

      .hero p {
        max-width: 620px;

        margin: auto;

        color: #9692a5;

        font-size: 15px;

        line-height: 1.8;
      }

      /* =====================================================
           AI PANEL
           ===================================================== */

      .ai-panel {
        width: min(920px, 100%);

        height: 650px;

        display: flex;

        flex-direction: column;

        overflow: hidden;

        border: 1px solid rgba(255, 255, 255, 0.11);

        border-radius: 30px;

        background: linear-gradient(
          145deg,
          rgba(19, 18, 37, 0.92),
          rgba(8, 8, 17, 0.94)
        );

        backdrop-filter: blur(35px);

        box-shadow:
          0 50px 130px rgba(0, 0, 0, 0.5),
          0 0 100px rgba(90, 80, 255, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);

        animation: panelIn 1s 0.1s both cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes panelIn {
        from {
          opacity: 0;

          transform: translateY(40px) scale(0.97);
        }

        to {
          opacity: 1;

          transform: translateY(0) scale(1);
        }
      }

      /* =====================================================
           PANEL HEADER
           ===================================================== */

      .panel-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 20px 24px;

        border-bottom: 1px solid rgba(255, 255, 255, 0.07);

        background: rgba(255, 255, 255, 0.015);
      }

      .assistant-info {
        display: flex;

        align-items: center;

        gap: 13px;
      }

      .assistant-avatar {
        position: relative;

        width: 48px;

        height: 48px;

        border-radius: 15px;

        display: flex;

        align-items: center;

        justify-content: center;

        background: linear-gradient(135deg, #7556ff, #4edfff);

        box-shadow: 0 8px 30px rgba(100, 100, 255, 0.3);

        font-size: 22px;
      }

      .assistant-avatar::before {
        content: "";

        position: absolute;

        inset: -4px;

        border-radius: 18px;

        border: 1px solid rgba(100, 210, 255, 0.35);

        animation: avatarRing 3s infinite;
      }

      @keyframes avatarRing {
        0% {
          transform: scale(1);

          opacity: 0.7;
        }

        70% {
          transform: scale(1.2);

          opacity: 0;
        }

        100% {
          opacity: 0;
        }
      }

      .assistant-name {
        font-size: 14px;

        font-weight: 700;
      }

      .assistant-status {
        display: flex;

        align-items: center;

        gap: 6px;

        color: #777286;

        font-size: 11px;

        margin-top: 4px;
      }

      .online-dot {
        width: 6px;

        height: 6px;

        border-radius: 50%;

        background: #5dffb1;

        box-shadow: 0 0 10px #5dffb1;
      }

      .clear-button {
        width: 36px;

        height: 36px;

        border: 0;

        border-radius: 11px;

        background: rgba(255, 255, 255, 0.04);

        color: #817d8e;

        cursor: pointer;

        font-size: 17px;

        transition: 0.25s;
      }

      .clear-button:hover {
        color: white;

        background: rgba(255, 255, 255, 0.08);
      }

      /* =====================================================
           MESSAGES
           ===================================================== */

      .messages {
        flex: 1;

        overflow-y: auto;

        padding: 28px;

        display: flex;

        flex-direction: column;

        gap: 17px;

        scrollbar-width: thin;

        scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
      }

      .message-row {
        display: flex;

        animation: messageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes messageIn {
        from {
          opacity: 0;

          transform: translateY(12px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message {
        max-width: 72%;

        padding: 14px 17px;

        border-radius: 18px;

        font-size: 13px;

        line-height: 1.65;
      }

      .message-row.ai .message {
        background: rgba(255, 255, 255, 0.045);

        border: 1px solid rgba(255, 255, 255, 0.075);

        color: #dcd8e6;

        border-bottom-left-radius: 5px;
      }

      .message-row.user .message {
        background: linear-gradient(135deg, #7658ff, #4caaff);

        color: white;

        border-bottom-right-radius: 5px;

        box-shadow: 0 10px 30px rgba(80, 90, 255, 0.17);
      }

      .message-label {
        font-size: 9px;

        letter-spacing: 1.5px;

        color: #777285;

        margin-bottom: 5px;
      }

      /* =====================================================
           TYPING
           ===================================================== */

      .typing {
        display: flex;

        gap: 5px;

        align-items: center;
      }

      .typing span {
        width: 7px;

        height: 7px;

        border-radius: 50%;

        background: #8d86a1;

        animation: typing 1.2s infinite;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);

          opacity: 0.35;
        }

        30% {
          transform: translateY(-5px);

          opacity: 1;
        }
      }

      /* =====================================================
           SUGGESTIONS
           ===================================================== */

      .suggestions {
        display: flex;

        gap: 8px;

        overflow-x: auto;

        padding: 0 24px 14px;

        scrollbar-width: none;
      }

      .suggestions::-webkit-scrollbar {
        display: none;
      }

      .suggestion {
        white-space: nowrap;

        padding: 9px 13px;

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 100px;

        background: rgba(255, 255, 255, 0.035);

        color: #aaa5b6;

        font-size: 10px;

        cursor: pointer;

        transition: 0.25s;
      }

      .suggestion:hover {
        color: white;

        border-color: rgba(110, 150, 255, 0.35);

        background: rgba(100, 90, 255, 0.1);

        transform: translateY(-2px);
      }

      /* =====================================================
           INPUT
           ===================================================== */

      .input-area {
        padding: 16px 20px 18px;

        border-top: 1px solid rgba(255, 255, 255, 0.07);

        background: rgba(0, 0, 0, 0.13);
      }

      .input-box {
        display: flex;

        align-items: flex-end;

        gap: 9px;

        padding: 7px 7px 7px 15px;

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 17px;

        background: rgba(255, 255, 255, 0.04);

        transition: 0.25s;
      }

      .input-box:focus-within {
        border-color: rgba(100, 180, 255, 0.4);

        box-shadow: 0 0 0 3px rgba(100, 120, 255, 0.06);
      }

      textarea {
        flex: 1;

        resize: none;

        max-height: 120px;

        border: 0;

        outline: none;

        background: transparent;

        color: white;

        font-family: inherit;

        font-size: 13px;

        line-height: 1.5;

        padding: 8px 0;
      }

      textarea::placeholder {
        color: #676274;
      }

      .send-button {
        width: 42px;

        height: 42px;

        flex-shrink: 0;

        border: 0;

        border-radius: 13px;

        background: linear-gradient(135deg, #7658ff, #52dfff);

        color: white;

        font-size: 20px;

        cursor: pointer;

        transition: 0.25s;
      }

      .send-button:hover {
        transform: translateY(-2px);

        box-shadow: 0 10px 25px rgba(80, 150, 255, 0.25);
      }

      .send-button:disabled {
        opacity: 0.4;

        cursor: not-allowed;
      }

      .footer {
        text-align: center;

        color: #545060;

        font-size: 9px;

        margin-top: 9px;

        letter-spacing: 0.4px;
      }

      /* =====================================================
           RESPONSIVE
           ===================================================== */

      @media (max-width: 700px) {
        .navbar {
          padding: 0 18px;
        }

        .main {
          padding: 35px 12px 50px;
        }

        .hero h1 {
          letter-spacing: -2.5px;
        }

        .hero p {
          font-size: 13px;
        }

        .ai-panel {
          height: calc(100vh - 280px);

          min-height: 520px;

          border-radius: 23px;
        }

        .messages {
          padding: 20px 15px;
        }

        .message {
          max-width: 85%;
        }
      }

      @media (max-width: 450px) {
        .logo span {
          display: none;
        }

        .hero {
          margin-bottom: 25px;
        }

        .hero h1 {
          font-size: 43px;
        }

        .ai-panel {
          height: calc(100vh - 250px);
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="background">
      <div class="grid"></div>

      <div class="orb orb-one"></div>

      <div class="orb orb-two"></div>

      <div class="orb orb-three"></div>
    </div>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="navbar">
      <div class="logo">
        <div class="logo-icon">⌂</div>

        <span> HouseMemory </span>
      </div>

      <a href="dashboard.html" class="back-button"> ← Back to dashboard </a>
    </nav>

    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">
      <!-- HERO -->

      <section class="hero">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>

          HOUSEMEMORY INTELLIGENCE
        </div>

        <h1>
          Meet your
          <br />

          <span>home's AI.</span>
        </h1>

        <p>
          Ask HouseMemory AI about maintenance, equipment, organisation,
          memories, documents and everything that helps your household run
          smoothly.
        </p>
      </section>

      <!-- =================================================
             AI PANEL
             ================================================= -->

      <section class="ai-panel">
        <!-- HEADER -->

        <div class="panel-header">
          <div class="assistant-info">
            <div class="assistant-avatar">✦</div>

            <div>
              <div class="assistant-name">HouseMemory AI</div>

              <div class="assistant-status">
                <span class="online-dot"></span>

                Online · Ready to help
              </div>
            </div>
          </div>

          <button
            class="clear-button"
            id="clearButton"
            title="Clear conversation"
          >
            ↺
          </button>
        </div>

        <!-- MESSAGES -->

        <div class="messages" id="messages"></div>

        <!-- SUGGESTIONS -->

        <div class="suggestions">
          <button
            class="suggestion"
            data-message="What maintenance should I do every month?"
          >
            🔧 Monthly maintenance
          </button>

          <button
            class="suggestion"
            data-message="How can I organise my household equipment?"
          >
            ⚙ Organise equipment
          </button>

          <button
            class="suggestion"
            data-message="How should I organise important household documents?"
          >
            ◈ Organise documents
          </button>

          <button
            class="suggestion"
            data-message="Give me ideas for preserving memories of my home."
          >
            ✦ Preserve memories
          </button>
        </div>

        <!-- INPUT -->

        <div class="input-area">
          <div class="input-box">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Ask HouseMemory AI anything..."
            ></textarea>

            <button class="send-button" id="sendButton">↑</button>
          </div>

          <div class="footer">
            HouseMemory AI
            <span>•</span>
            Powered by Gemini
          </div>
        </div>
      </section>
    </main>

    <script>
      /* =====================================================
           CONFIGURATION
           ===================================================== */

      const FUNCTION_URL =
        "https://bbxqrgevfqrbfhvxojvs.supabase.co/functions/v1/housememory-ai";

      /*
       * IMPORTANT:
       *
       * Replace this with your Supabase
       * PUBLISHABLE / ANON key.
       *
       * DO NOT put your Gemini API key here.
       */

      const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

      /* =====================================================
           ELEMENTS
           ===================================================== */

      const messages = document.getElementById("messages");

      const input = document.getElementById("messageInput");

      const sendButton = document.getElementById("sendButton");

      const clearButton = document.getElementById("clearButton");

      let isLoading = false;

      /* =====================================================
           ESCAPE HTML
           ===================================================== */

      function escapeHTML(text) {
        const element = document.createElement("div");

        element.textContent = text;

        return element.innerHTML;
      }

      /* =====================================================
           FORMAT RESPONSE
           ===================================================== */

      function formatResponse(text) {
        let formatted = escapeHTML(text);

        formatted = formatted.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

        formatted = formatted.replace(/\n/g, "<br>");

        return formatted;
      }

      /* =====================================================
           ADD MESSAGE
           ===================================================== */

      function addMessage(type, content) {
        const row = document.createElement("div");

        row.className = "message-row " + type;

        const bubble = document.createElement("div");

        bubble.className = "message";

        if (type === "ai") {
          bubble.innerHTML = `

                    <div class="message-label">
                        HOUSEMEMORY AI
                    </div>

                    ${content}

                `;
        } else {
          bubble.innerHTML = content;
        }

        row.appendChild(bubble);

        messages.appendChild(row);

        messages.scrollTop = messages.scrollHeight;
      }

      /* =====================================================
           WELCOME
           ===================================================== */

      function showWelcome() {
        addMessage(
          "ai",
          `
                    Hello! ✦ I'm your
                    HouseMemory AI assistant.

                    <br><br>

                    I can help you think about
                    maintenance, equipment,
                    household organisation,
                    documents and memories.

                    <br><br>

                    What would you like to work on?
                `,
        );
      }

      /* =====================================================
           TYPING
           ===================================================== */

      function showTyping() {
        const row = document.createElement("div");

        row.className = "message-row ai";

        row.id = "typingIndicator";

        row.innerHTML = `

                <div class="message">

                    <div class="message-label">
                        HOUSEMEMORY AI
                    </div>

                    <div class="typing">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            `;

        messages.appendChild(row);

        messages.scrollTop = messages.scrollHeight;
      }

      function removeTyping() {
        const typing = document.getElementById("typingIndicator");

        if (typing) {
          typing.remove();
        }
      }

      /* =====================================================
           SEND MESSAGE
           ===================================================== */

      async function sendMessage() {
        if (isLoading) {
          return;
        }

        const text = input.value.trim();

        if (!text) {
          return;
        }

        addMessage("user", escapeHTML(text));

        input.value = "";

        input.style.height = "auto";

        isLoading = true;

        sendButton.disabled = true;

        showTyping();

        try {
          const response = await fetch(FUNCTION_URL, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",

              apikey: SUPABASE_KEY,
            },

            body: JSON.stringify({
              message: text,
            }),
          });

          const data = await response.json();

          removeTyping();

          if (!response.ok) {
            throw new Error(data.error || "The AI could not respond.");
          }

          if (!data.message) {
            throw new Error("The AI returned an empty response.");
          }

          addMessage("ai", formatResponse(data.message));
        } catch (error) {
          console.error("HouseMemory AI error:", error);

          removeTyping();

          addMessage(
            "ai",
            `
                        I couldn't connect to
                        HouseMemory AI right now.

                        <br><br>

                        <span
                            style="
                                color:#817c8f;
                                font-size:11px;
                            "
                        >
                            Please check your connection
                            and try again.
                        </span>
                    `,
          );
        } finally {
          isLoading = false;

          sendButton.disabled = false;

          input.focus();
        }
      }

      /* =====================================================
           SEND BUTTON
           ===================================================== */

      sendButton.addEventListener("click", sendMessage);

      /* =====================================================
           ENTER KEY
           ===================================================== */

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();

          sendMessage();
        }
      });

      /* =====================================================
           AUTO RESIZE
           ===================================================== */

      input.addEventListener("input", function () {
        this.style.height = "auto";

        this.style.height = Math.min(this.scrollHeight, 120) + "px";
      });

      /* =====================================================
           CLEAR
           ===================================================== */

      clearButton.addEventListener("click", function () {
        messages.innerHTML = "";

        showWelcome();
      });

      /* =====================================================
           SUGGESTIONS
           ===================================================== */

      document.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", function () {
          input.value = this.dataset.message;

          input.dispatchEvent(new Event("input"));

          sendMessage();
        });
      });

      /* =====================================================
           START
           ===================================================== */

      showWelcome();
    </script>
